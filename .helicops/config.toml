secrets_patterns = [
    "sk-[a-zA-Z0-9]{20,}",
    "AKIA[0-9A-Z]{16}",
    "ASIA[0-9A-Z]{16}",
]
exempt_paths = [
    "migrations/",
    "generated/",
    "vendor/",
    ".venv/",
    "venv/",
    "__pycache__/",
    "*.egg-info/",
    "node_modules/",
    "target/",
    "dist/",
    "build/",
    ".helicops-backup/",
]
exempt_files = [
    "__init__.py",
    "conftest.py",
    "setup.py",
]

[helicops]
version = "3.0.0"
state = "team"
agent_scan_interval_seconds = 90

[languages.python]
enabled = true
beta = false
max_file_lines = 500
max_complexity = 20
max_class_methods = 20

[languages.typescript]
enabled = true
beta = false
max_file_lines = 500
max_complexity = 20
max_class_methods = 20

[languages.rust]
enabled = false
beta = false
max_file_lines = 500
max_complexity = 20
max_class_methods = 20

[languages.jvm]
enabled = false
beta = true
max_file_lines = 500
max_complexity = 20
max_class_methods = 20

[false_positive]
mode = "shadow"
ai_enabled = true
default_confidence_threshold = 70
never_suppress_severities = [
    "critical",
]
