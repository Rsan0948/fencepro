# Pre-commit hooks for FencePro.
# Install once with `pre-commit install` (requires the `pre-commit` Python
# package; `pipx install pre-commit` is the easiest path on macOS/Linux).
# CI runs the same checks via .github/workflows/ci.yml regardless.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: local
    hooks:
      - id: prettier
        name: prettier (format check)
        entry: npx prettier --check
        language: system
        types_or: [ts, tsx, javascript, jsx, json, yaml, markdown, css]
        pass_filenames: true

      - id: eslint
        name: eslint
        entry: npx eslint
        language: system
        types_or: [ts, tsx, javascript, jsx]
        pass_filenames: true
        require_serial: false

      - id: typecheck
        name: typecheck (tsc -b --noEmit)
        entry: npm run typecheck
        language: system
        pass_filenames: false
        types: [ts]
